[package]
name = "hyperfold-pcs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
p3-field = { path = "/home/zjl/BinaryField-Bench/vendor/Plonky3/field" }
p3-goldilocks = { path = "/home/zjl/BinaryField-Bench/vendor/Plonky3/goldilocks" }
p3-matrix = { path = "/home/zjl/BinaryField-Bench/vendor/Plonky3/matrix" }
p3-maybe-rayon = { path = "/home/zjl/BinaryField-Bench/vendor/Plonky3/maybe-rayon", features = ["parallel"] }
p3-symmetric = { path = "/home/zjl/BinaryField-Bench/vendor/Plonky3/symmetric" }
p3-commit = { path = "/home/zjl/BinaryField-Bench/vendor/Plonky3/commit" }
p3-merkle-tree = { path = "/home/zjl/BinaryField-Bench/vendor/Plonky3/merkle-tree" }
num-bigint = "0.5.1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
blake3 = "1.8.4"
rayon = "1.12"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
